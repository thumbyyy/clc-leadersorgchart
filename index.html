<title>CLC-USA Directory</title>

<style>
:root{--bg:#f1f6f7;--panel:#fff;--ink:#063f55;--line:#c6dde0;--acc:#0a688b;--gold:#fbca01;--danger:#a3342b}
@media (prefers-color-scheme:dark){:root{--bg:#04222f;--panel:#063f55;--ink:#eaf4f6;--line:#1c6178;--acc:#fbca01;--danger:#ff8f84}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px/1.5 Montserrat,system-ui,"Segoe UI",Arial,sans-serif;border-top:5px solid var(--gold);padding:20px}
.box{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
.box img{display:block;height:60px;width:auto;background:#fff;border-radius:8px;padding:6px 12px;margin:0 0 18px}
h1{font:700 21px/1.25 Montserrat,system-ui,sans-serif;margin:0 0 6px}
p{margin:0 0 16px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:12px}
button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:600 14px Montserrat,system-ui,sans-serif;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#063f55}}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#err{color:var(--danger);margin:12px 0 0;min-height:1.4em;font-size:13px}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openWith(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.s),iterations:D.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.i)},key,b64(D.c));
  return new TextDecoder().decode(buf);
}
function show(html){document.open();document.write(html);document.close()}
async function tryPw(pw,remember){
  const html=await openWith(pw);
  if(remember){try{sessionStorage.setItem("clc-pw",pw)}catch(e){}}
  show(html);
}
(async()=>{
  try{const s=sessionStorage.getItem("clc-pw");if(s){await tryPw(s,false);return}}catch(e){try{sessionStorage.removeItem("clc-pw")}catch(_){}}
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const b=document.getElementById("b"),err=document.getElementById("err");
  if(!window.crypto||!crypto.subtle){err.textContent="This page needs a secure (https) connection to open.";return}
  b.disabled=true;err.textContent="";
  try{await tryPw(document.getElementById("pw").value,true)}
  catch(x){err.textContent="That password isn\u2019t correct.";b.disabled=false;document.getElementById("pw").select()}
});
</script>
